<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Parking Finder</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div class="container">
    <h1>Smart Parking Finder</h1>
    <div id="auth">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" name="username" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p id="login-error" class="error"></p>
      <details>
        <summary>Register</summary>
        <form id="register-form">
          <input type="text" name="full_name" placeholder="Full name" />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password (min 8)" required />
          <button type="submit">Create account</button>
        </form>
        <p id="register-error" class="error"></p>
      </details>
    </div>

    <div id="dashboard" class="hidden">
      <h2>Dashboard</h2>
      <div>
        <label>City:</label>
        <select id="city-select"></select>
        <button id="refresh-cities">Refresh Cities</button>
      </div>
      <div id="admin-tools" class="hidden">
        <h3>Admin Tools</h3>
        <form id="create-city-form">
          <input type="text" name="name" placeholder="City name" required />
          <input type="text" name="state" placeholder="State" />
          <input type="text" name="country" placeholder="Country" />
          <button type="submit">Add City</button>
        </form>
        <form id="create-lot-form">
          <input type="text" name="name" placeholder="Lot name" required />
          <input type="text" name="address" placeholder="Address" required />
          <input type="number" name="total_slots" placeholder="Total slots" min="1" required />
          <input type="number" name="pricing_per_hour" placeholder="Price/hr" step="0.01" min="0" required />
          <button type="submit">Add Lot</button>
        </form>
      </div>
      <div>
        <ul id="lots-list"></ul>
      </div>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
